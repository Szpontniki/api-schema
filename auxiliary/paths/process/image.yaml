post:
  security: []
  summary: Processes an image into a set resolution.
  operationId: processImage
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/request-bodies/process-image-request.yaml'
  responses:
    '200':
      description: The image was processed successfully.
      content:
        application/json:
          schema:
            $ref: '../../schemas/response-bodies/process-image-resposne.yaml'
    '400':
      description: Invalid request body was provided.
