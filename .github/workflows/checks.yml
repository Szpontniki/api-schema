name: "Checks"
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  validate-check:
    name: 🗿 Validate Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Required Tooling
        run: npm install --global @redocly/cli

      - name: Validate
        run: ./validate.sh
