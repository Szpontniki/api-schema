name: "Checks"
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  validate-check:
    name: 🗿 Validate Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Validate
        run: nix develop -c ./validate.sh
