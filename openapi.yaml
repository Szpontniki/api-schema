openapi: 3.1.0

info:
  title: Szpontniki's Firmware API
  version: 0.1.0
  description: API of a LED-managing microcontroller developed by Szpontniki.
  contact:
    name: Szpontniki
    url: https://github.com/Szpontniki

paths:
  /users:
    get:
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: usr_123
        name:
          type: string
          example: Jane Doe
